name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: newslens
          POSTGRES_PASSWORD: newslens
          POSTGRES_DB: newslens
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U newslens"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - run: pip install -r requirements-dev.txt

      - run: ruff check app tests alembic

      - name: Run migrations
        env:
          DATABASE_URL: postgresql+psycopg://newslens:newslens@localhost:5432/newslens
        run: alembic upgrade head

      - name: Run tests
        env:
          DATABASE_URL: postgresql+psycopg://newslens:newslens@localhost:5432/newslens
        run: pytest --cov=app
